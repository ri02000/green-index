name: Clean last product brochure image
on:
  push:
    branches: [main]
    paths: [scripts/crop_helichrysum_touch_photo.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/crop_helichrysum_touch_photo.py
      - name: Publish clean crop
        run: |
          git config user.name green-index-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos/60228342.webp official_helichrysum_photo_import.json
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then exit 1; fi
          git commit -m 'Clean up official Helichrysum Touch product image crop'
          git push origin HEAD:main
