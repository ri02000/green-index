name: Normalize local oil-bottle card photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_local_product_photos.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow numpy
      - run: python scripts/normalize_local_product_photos.py
      - name: Validate and publish
        run: |
          python - <<'PY'
          import json
          from PIL import Image
          from pathlib import Path
          obj=json.loads(Path('photo_thumbnail_report.json').read_text(encoding='utf-8'))
          assert obj['created']>=35
          for item in obj['items']:
              with Image.open(item['thumbnail']) as im:
                  assert im.size==(440,440)
          PY
          git config user.name green-index-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thumbs/ photo_thumbnail_report.json
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo '::error::Main changed, refusing stale push'; exit 1
          fi
          git commit -m 'Publish consistently sized oil and roll-on card thumbnails'
          git push origin HEAD:main
