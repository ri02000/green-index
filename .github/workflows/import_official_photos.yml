name: Discover official product photo URLs
on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 09:15 Asia/Seoul
  push:
    paths:
      - 'scripts/discover_official_photo_urls.py'
      - 'scripts/probe_official_image_urls.py'
      - 'scripts/apply_verified_photos.py'
      - 'scripts/probe_cdn_patterns.py'
      - 'image_sources.csv'
      - 'products.csv'
      - '.github/workflows/import_official_photos.yml'
permissions:
  contents: write
concurrency:
  group: green-index-photo-discovery
  cancel-in-progress: false
jobs:
  image-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test likely official CDN file names without guessing validity
        run: python scripts/probe_cdn_patterns.py
      - name: Scan product source pages and record image links
        run: python scripts/discover_official_photo_urls.py
      - name: Test candidate image links
        run: python scripts/probe_official_image_urls.py
      - name: Apply verified official product photos to catalog and website
        run: python scripts/apply_verified_photos.py
      - name: Validate both embedded product catalogs and JavaScript
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path
          with open('products.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          for page in ('index.html','share.html'):
              html=Path(page).read_text(encoding='utf-8')
              match=re.search(r'const DATA=(\[[\s\S]*?\]);\s*const byCode=',html)
              if not match:
                  raise SystemExit(page+': missing embedded data')
              data=json.loads(match.group(1))
              assert len(data)==len(rows),(page,len(data),len(rows))
              assert [(p['code'],p['image_path']) for p in data]==[(p['code'],p['image_path']) for p in rows], page+': photo mismatch'
              Path('/tmp/'+page+'.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/share.html.js
      - name: Save source audit results
        run: |
          git config user.name 'green-index-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image_sources.csv image_pattern_probe.csv image_pattern_probe_report.json image_candidates.csv image_crawl_report.json official_image_probe.csv official_image_probe_report.json photo_import_status.json products.csv index.html share.html
          if git diff --cached --quiet; then
            echo "No recorded changes."
            echo "No changes to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never rebase generated files across concurrent user edits.
          # Their timestamps conflict even when the photo data is unchanged.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::Repository changed during scan. Skipping stale output safely; the next run will rescan."
            echo "Source files changed during the scan. No generated files were published; retry from the latest main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Record official image URL discovery results'
          if ! git push origin HEAD:main; then
            echo "::warning::Repository advanced during upload; generated output was not published."
            echo "Concurrent update prevented this upload; no existing site data was overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Verified scan report published successfully." >> "$GITHUB_STEP_SUMMARY"
