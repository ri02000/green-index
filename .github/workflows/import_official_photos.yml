name: Discover official product photo URLs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/discover_official_photo_urls.py'
      - 'scripts/probe_official_image_urls.py'
      - 'scripts/probe_cdn_patterns.py'
      - 'image_sources.csv'
      - 'products.csv'
      - '.github/workflows/import_official_photos.yml'
permissions:
  contents: write
concurrency:
  group: green-index-photo-discovery
  cancel-in-progress: false
jobs:
  image-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test likely official CDN file names without guessing validity
        run: python scripts/probe_cdn_patterns.py
      - name: Scan product source pages and record image links
        run: python scripts/discover_official_photo_urls.py
      - name: Test candidate image links
        run: python scripts/probe_official_image_urls.py
      - name: Save source audit results
        run: |
          git config user.name 'green-index-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add image_sources.csv image_pattern_probe.csv image_pattern_probe_report.json image_candidates.csv image_crawl_report.json official_image_probe.csv official_image_probe_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record official image URL discovery results'
            git fetch origin main
            git rebase origin/main
            git push
          fi
