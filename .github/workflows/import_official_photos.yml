name: Import official product image candidates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import_official_photos.yml'
      - 'scripts/import_official_photos.py'
      - 'image_sources.csv'
permissions:
  contents: write
concurrency:
  group: green-index-photo-import
  cancel-in-progress: false
jobs:
  image-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python scripts/import_official_photos.py
      - name: Commit reviewed image candidates and import report
        run: |
          git config user.name 'green-index-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photos products.csv index.html share.html image_import_report.json
          git diff --cached --quiet || (git commit -m 'Import official product photo candidates' && git push)
